<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Calendar body -->
  <rect x="96" y="144" width="320" height="272" rx="24" fill="white" fill-opacity="0.15"/>
  <rect x="96" y="144" width="320" height="272" rx="24" fill="none" stroke="white" stroke-opacity="0.4" stroke-width="4"/>
  <!-- Header bar -->
  <rect x="96" y="144" width="320" height="72" rx="24" fill="white" fill-opacity="0.25"/>
  <rect x="96" y="192" width="320" height="24" fill="white" fill-opacity="0.25"/>
  <!-- Hooks -->
  <rect x="176" y="96" width="20" height="64" rx="10" fill="white" fill-opacity="0.9"/>
  <rect x="316" y="96" width="20" height="64" rx="10" fill="white" fill-opacity="0.9"/>
  <!-- Grid dots (calendar days) -->
  <circle cx="160" cy="280" r="12" fill="white" fill-opacity="0.9"/>
  <circle cx="214" cy="280" r="12" fill="white" fill-opacity="0.5"/>
  <circle cx="268" cy="280" r="12" fill="white" fill-opacity="0.5"/>
  <circle cx="322" cy="280" r="12" fill="white" fill-opacity="0.5"/>
  <circle cx="376" cy="280" r="12" fill="white" fill-opacity="0.5"/>
  <circle cx="160" cy="334" r="12" fill="white" fill-opacity="0.5"/>
  <circle cx="214" cy="334" r="12" fill="white" fill-opacity="0.5"/>
  <circle cx="268" cy="334" r="12" fill="white" fill-opacity="0.9"/>
  <circle cx="322" cy="334" r="12" fill="white" fill-opacity="0.5"/>
  <circle cx="376" cy="334" r="12" fill="white" fill-opacity="0.5"/>
  <!-- Today indicator ring -->
  <circle cx="268" cy="334" r="20" fill="none" stroke="white" stroke-width="4"/>
</svg>
